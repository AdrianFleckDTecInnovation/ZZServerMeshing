[package]
name = "coordinator"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
# socket2 is used to configure TCP keepalive on the sim-server accept path so
# the kernel surfaces half-open TCP connections (kill -9, power-off) within
# seconds rather than minutes-to-hours. See design 016 Batch 1 / finding 076.
# The `all` feature unlocks `TcpKeepalive::with_retries` (TCP_KEEPCNT) on linux.
socket2 = { version = "0.5", features = ["all"] }
