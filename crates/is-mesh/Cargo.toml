[package]
name = "is-mesh"
version = "0.1.0"
edition = "2021"
description = "InfiniteStars Server Meshing: distributed authority, spatial interest and replication for Bevy 0.15"
readme = "README.md"
repository = "https://github.com/AdrianFleckDTecInnovation/ZZServerMeshing"

[dependencies]
bevy_app = "0.15"
bevy_ecs = "0.15"
serde = { version = "1", features = ["derive","rc"] }
bincode = "1.3"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
ring = "0.17"
thiserror = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
