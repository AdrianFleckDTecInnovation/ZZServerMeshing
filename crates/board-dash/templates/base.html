<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}unoq{% endblock %}</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <style>
        canvas.chart { width: 100%; height: 120px; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 768px) { .chart-grid { grid-template-columns: 1fr; } }
        .chart-label { display: flex; justify-content: space-between; margin-bottom: 0.25rem; }
        .chart-label .live-value { font-family: monospace; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline; }
        .svc-dot { display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; }
        .svc-dot.active { background: #69db7c; }
        .svc-dot.inactive { background: #ff6b6b; }
    </style>
</head>
<body>
    <main class="container">
        <nav>
            <ul><li><strong>{% block nav_title %}unoq{% endblock %}</strong></li></ul>
            <ul>
                <li><a href="/">Dashboard</a></li>
            </ul>
        </nav>
        {% block content %}{% endblock %}
    </main>
    <script src="/static/htmx.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
