<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Meshing Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #111; font-family: monospace; }
    canvas { display: block; }
    #debug-overlay {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #0f0;
      font-size: 13px;
      line-height: 1.6;
      pointer-events: none;
      text-shadow: 0 0 4px rgba(0, 255, 0, 0.5);
      z-index: 100;
    }
    #controls-help {
      position: fixed;
      bottom: 10px;
      left: 10px;
      color: #888;
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="debug-overlay"></div>
  <div id="controls-help">
    WASD: move player | F: toggle camera follow | Click: spawn NPC | Scroll: zoom | Drag: orbit
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
