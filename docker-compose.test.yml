# Server Meshing Test Cluster
# Simulates Raspberry Pi Zero W2 constraints per sim-server:
#   - BCM2710A1: 4x ARM Cortex-A53 @ 1GHz
#   - Docker can't throttle clock speed, so we approximate with:
#     cpus: 0.25 (~1 core at 25% of host speed ≈ 1GHz ARM equivalent)
#   - 512MB RAM
#
# Usage:
#   docker compose -f docker-compose.test.yml build
#   docker compose -f docker-compose.test.yml up
#   ./test.sh --docker
#   docker compose -f docker-compose.test.yml down
#
# Configuration: override values in .env or pass as environment variables.

services:
  coordinator:
    build:
      context: .
      dockerfile: docker/Dockerfile.rust
    entrypoint: ["coordinator"]
    command: ["--port", "${COORD_WS_PORT:-7870}", "--http-port", "${COORD_HTTP_PORT:-7871}"]
    ports:
      - "${COORD_WS_PORT:-7870}:${COORD_WS_PORT:-7870}"
      - "${COORD_HTTP_PORT:-7871}:${COORD_HTTP_PORT:-7871}"
    cpus: ${DOCKER_CPUS:-0.25}
    mem_limit: ${DOCKER_MEM:-512m}
    networks:
      - mesh

  sim-server-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.rust
    entrypoint: ["sim-server"]
    command: [
      "--server-id", "1",
      "--port", "7878",
      "--udp-port", "9101",
      "--metrics-port", "8101",
      "--coordinator", "coordinator:${COORD_WS_PORT:-7870}",
      "--advertise-host", "sim-server-1",
      "--initial-npcs", "${DOCKER_NPCS_PER_SERVER:-10}"
    ]
    ports:
      - "7878:7878"
      - "8101:8101"
      - "9101:9101/udp"
    cpus: ${DOCKER_CPUS:-0.25}
    mem_limit: ${DOCKER_MEM:-512m}
    depends_on:
      - coordinator
    networks:
      - mesh

  sim-server-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.rust
    entrypoint: ["sim-server"]
    command: [
      "--server-id", "2",
      "--port", "7879",
      "--udp-port", "9102",
      "--metrics-port", "8102",
      "--coordinator", "coordinator:${COORD_WS_PORT:-7870}",
      "--advertise-host", "sim-server-2",
      "--initial-npcs", "${DOCKER_NPCS_PER_SERVER:-10}"
    ]
    ports:
      - "7879:7879"
      - "8102:8102"
      - "9102:9102/udp"
    cpus: ${DOCKER_CPUS:-0.25}
    mem_limit: ${DOCKER_MEM:-512m}
    depends_on:
      - coordinator
    networks:
      - mesh

  sim-server-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.rust
    entrypoint: ["sim-server"]
    command: [
      "--server-id", "3",
      "--port", "7880",
      "--udp-port", "9103",
      "--metrics-port", "8103",
      "--coordinator", "coordinator:${COORD_WS_PORT:-7870}",
      "--advertise-host", "sim-server-3",
      "--initial-npcs", "${DOCKER_NPCS_PER_SERVER:-10}"
    ]
    ports:
      - "7880:7880"
      - "8103:8103"
      - "9103:9103/udp"
    cpus: ${DOCKER_CPUS:-0.25}
    mem_limit: ${DOCKER_MEM:-512m}
    depends_on:
      - coordinator
    networks:
      - mesh

networks:
  mesh:
    driver: bridge
