name: Native mesh

on: [push, pull_request, workflow_dispatch]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup default stable
      - run: npm run setup
      - run: npm test
      - run: npm run smoke
      - run: npm run bench -- --servers 3 --npcs 300 --seconds 10
      - run: npm --prefix mcp-oracle ci
      - run: npm --prefix mcp-oracle run build
