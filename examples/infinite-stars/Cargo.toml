[package]
name = "infinite-stars"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "infinite-stars"

[dependencies]
is-mesh = { path = "../../crates/is-mesh" }
bevy = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
rcgen = "0.13"
rusqlite = { version = "0.43", features = ["bundled"] }

tempfile = "3"
